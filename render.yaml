services:
  - type: web
    name: agentci
    runtime: python
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-2.5-flash
      - key: LLM_PROVIDER
        value: gemini
      - key: DEBUG
        value: "false"
    plan: free

